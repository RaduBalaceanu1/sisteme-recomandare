<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 01 - Colectare Date Implicite</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            max-width: 400px;
            width: 100%;
        }
        h2 {
            margin-top: 0;
            color: #1a202c;
            font-size: 1.25rem;
        }
        p {
            color: #4a5568;
            font-size: 0.9rem;
        }
        label {
            display: block;
            margin-top: 15px;
            font-weight: 600;
            color: #2d3748;
            font-size: 0.85rem;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            margin-bottom: 20px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 0.95rem;
        }
        button {
            width: 100%;
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 11px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>🛠️ Lab 01: Data Collector</h2>
        <p>Introduceti numele complet pentru a trimite cererea POST (local) si a genera amprenta:</p>
        
        <form action="/track" method="POST">
            <label for="student_name">Nume si prenume student:</label>
            <input type="text" id="student_name" name="student_name" placeholder="ex: Popescu Ion" required>
            <button type="submit">Trimite</button>
        </form>
    </div>
</body>
</html>
